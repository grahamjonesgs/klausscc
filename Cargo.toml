[package]
name = "klausscc"
version = "0.1.2"
edition = "2024"
# as_chunks (debug/arch.rs) needs 1.88; is_multiple_of needs 1.87.
rust-version = "1.88"
authors = ["Graham Jones"]
description = "Assembler for Klauss micro controller defined in FPGA"
repository = "https://github.com/grahamjonesgs/klausscc.git"
readme = "README.md"
license = "MIT"
keywords = ["assembler"]
categories = ["development-tools"]
# Ship the sources, docs, runtime library, test fixtures and lockfile only.
# The globs name file types rather than whole directories, because an
# explicit include list ignores .gitignore: generated .code/.kbt outputs,
# scratch copies and Finder metadata in the working tree stay out.  The
# crate-root modules are listed by name for the same reason.
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "build.rs",
    "clippy.toml",
    "rustfmt.toml",
    "src/main.rs",
    "src/lib.rs",
    "src/cli.rs",
    "src/diag.rs",
    "src/error.rs",
    "src/layout.rs",
    "src/loader.rs",
    "src/num.rs",
    "src/asm/**/*.rs",
    "src/commands/*.rs",
    "src/debug/**/*.rs",
    "src/emu/*.rs",
    "src/isa/*.rs",
    "src/jtag/*.rs",
    "src/link/**/*.rs",
    "src/output/*.rs",
    "doc/*.md",
    "doc/FLAG_UNIFICATION_CHANGES",
    "runtime/*.c",
    "runtime/*.h",
    "runtime/*.kla",
    "tests/*.rs",
    "tests/fixtures/README.md",
    "tests/fixtures/all_tests.txt",
    "tests/fixtures/*.kla",
    "tests/fixtures/*.c",
    "tests/fixtures/adventure.elf",
    "tests/fixtures/hello.elf",
    "tests/fixtures/hello1.elf",
    "tests/fixtures/hello2.elf",
    "tests/fixtures/test_64bit.elf",
    "tests/fixtures/legacy_v1/README.md",
    "tests/fixtures/legacy_v1/*.kla",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4" }
colored = { version = "3.1.1"}
itertools = { version = "0.15.0"}
serialport = { version = "4.10", default-features = false}
serde = { version = "1.0", features = ["derive"] }
serde_json = {version = "1.0"}
crossterm = { version = "0.29" }
object = { version = "0.40.0", default-features = false, features = ["read"] }
gdbstub = "0.7"

[dev-dependencies]
tempfile = "3.2"

[features]
# `--gdbserver PORT --board`: debug the real board over its USB-JTAG.
# Links the system libftdi1 (Debian/Ubuntu: libftdi1-dev; macOS: brew install
# libftdi), which build.rs locates with pkg-config when it is installed.
board = []

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["term"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
# Crate-internal items are pub(crate); pub is only the library's API.
unreachable_pub = "warn"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic lints that don't fit a CLI assembler/codec binary
missing_errors_doc       = "allow"
module_name_repetitions  = "allow"
too_many_lines           = "allow"
cast_possible_truncation = "allow"
cast_sign_loss           = "allow"
cast_precision_loss      = "allow"
cast_possible_wrap       = "allow"
# Extension checks run on pre-lowercased names against fixed .kla/.kbt conventions
case_sensitive_file_extension_comparisons = "allow"

# Cherry-picked restriction lints worth keeping (catch real mistakes)
unwrap_used   = "warn"
expect_used   = "warn"
dbg_macro     = "warn"
todo          = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
